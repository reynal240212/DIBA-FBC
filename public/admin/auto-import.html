<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Importador Rápido — DIBA FBC Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/ESCUDO.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="/styles/admin-common.css">
    <script src="/scripts/theme-switcher.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#020617] text-white font-['Outfit'] selection:bg-gold/30">
    <div class="fixed inset-0 pointer-events-none z-0" style="background: var(--mesh-bg)"></div>

    <div id="admin-nav"></div>

    <main class="lg:ml-[280px] pt-[80px] min-h-screen transition-all duration-300 relative z-10 flex items-center justify-center p-6">
        <div class="w-full max-w-xl animate-fade-up">
            <div class="mb-10 text-center">
                <div class="flex items-center justify-center gap-3 mb-3">
                    <span class="w-8 h-1 bg-gold rounded-full"></span>
                    <p class="text-white/60 font-bold uppercase tracking-[0.4em] text-[0.65rem]">Automatización Deportiva</p>
                    <span class="w-8 h-1 bg-gold rounded-full"></span>
                </div>
                <h2 class="text-4xl lg:text-5xl font-black italic text-white uppercase tracking-tighter">Auto <span class="text-gold">Importador</span></h2>
            </div>

            <div class="panel p-10 text-center shadow-[0_30px_100px_rgba(0,0,0,0.5)] border-white/10">
                <div class="w-20 h-20 mx-auto mb-6 bg-gold/10 border border-gold/20 rounded-3xl flex items-center justify-center text-gold text-3xl">
                    <i class="fas fa-cloud-arrow-up"></i>
                </div>
                <h3 class="text-xl font-black italic uppercase text-white mb-3">Carga Masiva de Jornada</h3>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest leading-relaxed mb-8">
                    Sincroniza automáticamente el lote programado de partidos y la convocatoria oficial directamente en Supabase.
                </p>
                
                <div class="flex flex-col sm:flex-row gap-4">
                    <a href="partidos.html" class="flex-1 py-5 bg-white/5 border border-white/10 text-white/70 rounded-2xl font-black uppercase text-[0.7rem] tracking-widest hover:bg-white/10 hover:text-white transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-arrow-left"></i> Volver a Partidos
                    </a>
                    <button id="importBtn" class="flex-[2] py-5 bg-gold text-[#004d98] rounded-2xl font-black uppercase text-[0.75rem] tracking-widest shadow-xl shadow-gold/20 hover:scale-[1.02] transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-bolt"></i> Subir a Supabase Ahora
                    </button>
                </div>
                
                <div id="status" class="mt-8 text-[0.7rem] font-black uppercase tracking-widest hidden p-4 rounded-2xl bg-white/5 border border-white/10"></div>
            </div>
        </div>
    </main>

    <script src="/scripts/config.js"></script>
    <script type="module">
        import { initAdminLayout } from '../src/components/layout/admin-layout.js';
        import { supabase, requireAdmin } from '/scripts/supabaseClient.js';

        initAdminLayout();

        const btn = document.getElementById('importBtn');
        const status = document.getElementById('status');

        const matches = [
            {
                fecha: '2026-04-25',
                hora: '01:00 PM',
                categoria: '2013',
                equipolocal: 'ESC DIBA',
                equipovisitante: 'SOCER KIDS',
                Cancha: 'CALANCALA',
                descripcion: 'Generación Victoriosa - 2° Fecha',
                resultado: 'Pendiente'
            },
            {
                fecha: '2026-04-25',
                hora: '02:00 PM',
                categoria: '2014-2015',
                equipolocal: 'ESC DIBA',
                equipovisitante: 'ESC PUMA FC',
                Cancha: 'CALANCALA',
                descripcion: 'Generación Victoriosa - 2° Fecha',
                resultado: 'Pendiente'
            },
            {
                fecha: '2026-04-25',
                hora: '02:50 PM',
                categoria: '2011-2012',
                equipolocal: 'ESC DIBA',
                equipovisitante: 'ESC CRISTO REY',
                Cancha: 'CALANCALA',
                descripcion: 'Generación Victoriosa - 2° Fecha',
                resultado: 'Pendiente'
            }
        ];

        const convocatoria = {
            titulo: 'PARTIDOS CALANCALA - GENERACIÓN VICTORIOSA',
            fecha: '2026-04-25T11:45:00',
            lugar: 'CASA DEL PROFESOR',
            descripcion: 'UNIFORME: NUEVO HOMENAJE AL BARRANQUILLA. COSTO: $14.000 (ARBITRAJE Y TRANSPORTE). NEQUI: 3246656083.'
        };

        btn.onclick = async () => {
            status.classList.remove('hidden');
            status.innerHTML = '<span class="text-gold animate-pulse"><i class="fas fa-circle-notch fa-spin mr-2"></i>Sincronizando con Supabase...</span>';
            btn.disabled = true;
            btn.style.opacity = '0.5';

            try {
                const session = await requireAdmin();
                if (!session) {
                    status.innerHTML = '<span class="text-red-500">Error: No estás autenticado</span>';
                    return;
                }

                // 1. Partidos
                const { error: mErr } = await supabase.from('partidos').insert(matches);
                if (mErr) throw mErr;

                // 2. Convocatoria
                const { error: cErr } = await supabase.from('convocatorias').insert([convocatoria]);
                if (cErr) throw cErr;

                status.innerHTML = '<span class="text-emerald-400"><i class="fas fa-check-circle mr-2"></i>Lote sincronizado correctamente</span>';
                setTimeout(() => { window.location.href = 'partidos.html'; }, 2000);
            } catch (err) {
                console.error(err);
                status.innerHTML = `<span class="text-red-500">Error: ${err.message}</span>`;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        };
    </script>
</body>
</html>
