<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrativo — DIBA FBC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/ESCUDO.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/styles/admin-common.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --blue:  #004d98;
            --blue2: #003370;
            --gold:  #ffd700;
            --gold2: #f59e0b;
            --dark:  #020617;
            --mono: 'Share Tech Mono', monospace;
        }
        body {
            background: var(--dark);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        .club-card {
            width: 100%; max-width: 460px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,215,0,0.15),
                0 40px 80px -20px rgba(0,0,0,0.7),
                0 0 60px -10px rgba(0,77,152,0.3);
        }

        .card-header {
            background: linear-gradient(160deg, #004d98 0%, #002d6e 60%, #001a45 100%);
            padding: 2.5rem 2rem 2rem;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .card-header::before {
            content: '';
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                -45deg,
                transparent 0px, transparent 14px,
                rgba(255,255,255,0.03) 14px, rgba(255,255,255,0.03) 28px
            );
        }
        .card-header::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700 30%, #f59e0b 70%, transparent);
        }

        .shield-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .shield-glow-bg {
            position: absolute;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.18) 0%, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,100% { transform: scale(0.9); opacity: 0.6; }
            50%      { transform: scale(1.1); opacity: 1; }
        }
        .orbit-ring {
            position: absolute;
            width: 128px; height: 128px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,215,0,0.4);
            border-top-color: rgba(255,215,0,0.9);
            animation: orbit 4s linear infinite;
        }
        .orbit-ring-2 {
            width: 148px; height: 148px;
            border: 1px solid rgba(255,215,0,0.15);
            border-bottom-color: rgba(255,215,0,0.5);
            animation: orbit 7s linear infinite reverse;
        }
        @keyframes orbit { to { transform: rotate(360deg); } }

        #shield-3d-container {
            position: relative; z-index: 2;
            width: 96px; height: 96px;
        }
        #shield-image {
            width: 100%; height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(255,215,0,0.25));
        }

        .club-name {
            font-size: 1.85rem; font-weight: 900;
            letter-spacing: -0.02em; color: #fff;
            line-height: 1; text-transform: uppercase;
        }
        .club-name span { color: var(--gold); }
        .club-motto {
            font-family: var(--mono);
            font-size: 0.55rem; letter-spacing: 0.4em;
            color: rgba(255,215,0,0.6);
            text-transform: uppercase; margin-top: 0.35rem;
        }

        .jersey-divider {
            height: 4px;
            background: linear-gradient(90deg, #002d6e, #004d98 20%, #ffd700 50%, #004d98 80%, #002d6e);
        }

        .card-body {
            background: rgba(8,15,35,0.95);
            backdrop-filter: blur(20px);
            padding: 2rem 2rem 1.75rem;
        }

        .access-badge {
            display: flex; align-items: center; justify-content: center;
            gap: 0.6rem; margin-bottom: 1.75rem;
        }
        .access-badge span {
            font-family: var(--mono);
            font-size: 0.58rem; font-weight: 700;
            color: rgba(255,215,0,0.85);
            letter-spacing: 0.3em; text-transform: uppercase;
        }
        .badge-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold), 0 0 20px rgba(255,215,0,0.4);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        .field-group { margin-bottom: 1.2rem; }
        .field-label {
            display: block; font-size: 0.58rem; font-weight: 800;
            letter-spacing: 0.25em; text-transform: uppercase;
            color: rgba(255,255,255,0.35); margin-bottom: 0.5rem;
            padding-left: 0.25rem;
        }
        .field-wrap { position: relative; }
        .field-icon {
            position: absolute; left: 1rem; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,215,0,0.3); font-size: 0.8rem;
            transition: color 0.3s; pointer-events: none;
        }
        .field-wrap:focus-within .field-icon { color: var(--gold); }
        .field-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem; font-weight: 600;
            letter-spacing: 0.05em; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }
        .field-input::placeholder { color: rgba(255,255,255,0.18); font-weight: 400; }
        .field-input:focus {
            border-color: rgba(255,215,0,0.45);
            background: rgba(255,215,0,0.03);
            box-shadow: 0 0 0 3px rgba(255,215,0,0.08);
        }

        .pw-eye {
            position: absolute; right: 1rem; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.2);
            cursor: pointer; font-size: 0.75rem;
            transition: color 0.3s;
        }
        .pw-eye:hover { color: var(--gold); }

        .forgot-btn {
            font-size: 0.58rem; font-weight: 700;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.2em; text-transform: uppercase;
            cursor: pointer; transition: color 0.3s;
            background: none; border: none;
        }
        .forgot-btn:hover { color: var(--gold); }

        .submit-btn {
            width: 100%; margin-top: 1.5rem; padding: 1rem;
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            border: none; border-radius: 14px;
            color: var(--blue2);
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem; font-weight: 900;
            letter-spacing: 0.25em; text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 30px -8px rgba(255,215,0,0.4);
            display: flex; align-items: center; justify-content: center; gap: 0.7rem;
            transition: all 0.25s ease;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px -8px rgba(255,215,0,0.55); }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .card-footer {
            padding: 1rem 2rem 1.5rem;
            background: rgba(0,0,0,0.35);
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .back-link {
            font-size: 0.58rem; font-weight: 700;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.3em; text-transform: uppercase;
            text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.5rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--gold); }

        .card-meta {
            text-align: center; margin-top: 1.25rem;
            display: flex; align-items: center; justify-content: center; gap: 1rem;
        }
        .meta-line { flex: 1; max-width: 60px; height: 1px; background: rgba(255,215,0,0.2); }
        .meta-text {
            font-family: var(--mono);
            font-size: 0.55rem; font-weight: 700;
            color: rgba(255,215,0,0.6);
            letter-spacing: 0.25em; text-transform: uppercase;
        }

        #alert-container { margin-bottom: 1rem; }
        .alert-box {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.85rem 1rem; border-radius: 10px;
            font-size: 0.62rem; font-weight: 800;
            letter-spacing: 0.1em; text-transform: uppercase;
        }
        .alert-error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.25);  color: #f87171; }
        .alert-success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.25);  color: #4ade80; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 font-['Outfit']">
    <div>
        <div class="club-card">
            <div class="card-header">
                <div class="shield-wrap">
                    <div class="shield-glow-bg"></div>
                    <div class="orbit-ring"></div>
                    <div class="orbit-ring orbit-ring-2"></div>
                    <div id="shield-3d-container">
                        <img src="/images/ESCUDO.webp" alt="Escudo DIBA" id="shield-image">
                    </div>
                </div>
                <h2 class="club-name">DIBA <span>FBC</span></h2>
                <p class="club-motto">Sistema Administrativo</p>
            </div>

            <div class="jersey-divider"></div>

            <div class="card-body">
                <div class="access-badge">
                    <div class="badge-dot"></div>
                    <span>Acceso Restringido</span>
                </div>

                <div id="alert-container"></div>

                <form id="login-form">
                    <div class="field-group">
                        <label class="field-label">Correo Electrónico</label>
                        <div class="field-wrap">
                            <i class="fas fa-user field-icon"></i>
                            <input type="email" id="login-username" required placeholder="admin@diba.com" class="field-input">
                        </div>
                    </div>

                    <div class="field-group">
                        <div class="flex justify-between items-center px-1 mb-2">
                            <label class="field-label !mb-0">Contraseña</label>
                            <button type="button" id="forgot-link" class="forgot-btn">¿Recuperar?</button>
                        </div>
                        <div class="field-wrap">
                            <i class="fas fa-lock field-icon"></i>
                            <input type="password" id="login-password" required placeholder="••••••••" class="field-input">
                            <span class="pw-eye" id="pw-toggle"><i class="fas fa-eye-slash" id="pw-icon"></i></span>
                        </div>
                    </div>

                    <button type="submit" id="login-button" class="submit-btn">
                        <span class="button-text">Iniciar Sesión</span>
                        <i class="fas fa-arrow-right-to-bracket"></i>
                        <i class="fas fa-circle-notch fa-spin hidden" id="spinner"></i>
                    </button>
                </form>

                <div class="mt-6">
                    <div class="flex items-center gap-4 mb-5">
                        <div class="flex-1 h-[1px] bg-white/10"></div>
                        <span class="text-[0.55rem] font-bold text-white/25 uppercase tracking-[0.3em]">o continúa con</span>
                        <div class="flex-1 h-[1px] bg-white/10"></div>
                    </div>
                    <button type="button" id="google-login-btn"
                        class="w-full py-3.5 bg-white/5 border border-white/10 rounded-2xl text-white/70 font-bold text-[0.75rem] uppercase tracking-[0.15em] flex items-center justify-center gap-3 hover:bg-white/10 hover:border-white/20 hover:text-white transition-all">
                        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span>Iniciar con Google</span>
                    </button>
                </div>
            </div>

            <div class="card-footer">
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i> Volver al Portal
                </a>
            </div>
        </div>

        <div class="card-meta">
            <div class="meta-line"></div>
            <span class="meta-text">DIBA FBC — SYS v2.0</span>
            <div class="meta-line"></div>
        </div>
    </div>

    <script src="/scripts/config.js"></script>
    <script type="module">
        import { iniciarSesion, iniciarSesionGoogle, enviarCorreoRecuperacion } from "/scripts/auth.js";

        const loginForm      = document.getElementById('login-form');
        const loginBtn       = document.getElementById('login-button');
        const alertContainer = document.getElementById('alert-container');
        const spinner        = document.getElementById('spinner');
        const btnText        = loginBtn.querySelector('.button-text');

        function showAlert(msg, type = 'error') {
            const cls = type === 'error' ? 'alert-error' : 'alert-success';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
            alertContainer.innerHTML = `
                <div class="alert-box ${cls}">
                    <i class="fas ${icon}"></i><span>${msg}</span>
                </div>`;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            loginBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'Verificando...';
            alertContainer.innerHTML = '';
            try {
                await iniciarSesion(username, password);
                btnText.textContent = 'Acceso concedido';
                showAlert('Credenciales verificadas. Cargando panel...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1200);
            } catch (err) {
                showAlert(err.message === 'Invalid login credentials'
                    ? 'Usuario o contraseña incorrectos.'
                    : err.message);
                loginBtn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'Iniciar Sesión';
            }
        });

        document.getElementById('forgot-link').addEventListener('click', async () => {
            const email = document.getElementById('login-username').value.trim();
            if (!email) { showAlert('Ingresa tu correo primero.'); return; }
            try {
                await enviarCorreoRecuperacion(email);
                showAlert('Enlace de recuperación enviado.', 'success');
            } catch (err) { showAlert('Error: ' + err.message); }
        });

        document.getElementById('pw-toggle').addEventListener('click', () => {
            const inp = document.getElementById('login-password');
            const ico = document.getElementById('pw-icon');
            const show = inp.type !== 'text';
            inp.type = show ? 'text' : 'password';
            ico.className = show ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        document.getElementById('google-login-btn').addEventListener('click', async () => {
            alertContainer.innerHTML = '';
            try {
                await iniciarSesionGoogle();
                showAlert('Acceso con Google concedido. Cargando...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1200);
            } catch (err) {
                showAlert('Error con Google: ' + err.message);
            }
        });
    </script>
</body>
</html>
