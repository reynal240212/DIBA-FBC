<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Debug OpenWA - DIBA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #0f0; padding: 20px; }
    pre { background: #0d0d0d; padding: 15px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
    button { background: #e94560; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
    button:hover { background: #c73e54; }
    h1 { color: #e94560; }
    .status { color: #ffd700; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Debug OpenWA - DIBA FBC</h1>
  <p>Este archivo diagnostica por que el Endpoint de WhatsApp falla.</p>
  <div id="login-section">
    <p>Primero necesitas iniciar sesion. Ingresa tu email y password:</p>
    <input id="email" type="email" placeholder="Email" style="padding:8px;width:250px;font-size:14px;">
    <input id="password" type="password" placeholder="Password" style="padding:8px;width:250px;font-size:14px;">
    <button onclick="doLogin()">Login</button>
  </div>
  <div id="results-section" style="display:none;">
    <button onclick="runDebug('status')">1. Verificar sesion OpenWA</button>
    <button onclick="runDebug('groups')">2. Obtener grupos</button>
    <button onclick="runDebug('debug')">3. Respuesta cruda OpenWA</button>
    <div class="status" id="status"></div>
    <pre id="output">Esperando...</pre>
  </div>

  <script>
    const SUPABASE_URL = 'https://wdnlqfiwuocmmcdowjyw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkbmxxZml3dW9jbW1jZG93anl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg1MjY1ODAsImV4cCI6MjA2NDEwMjU4MH0.4SCS_NRDIYLQJ1XouqW111BxkMOlwMWOjje9gFTgW_Q';
    let client;

    async function doLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('status').textContent = 'ERROR LOGIN: ' + error.message;
        return;
      }
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('results-section').style.display = 'block';
      document.getElementById('status').textContent = 'Login OK. Ahora presiona los botones.';
    }

    async function runDebug(action) {
      document.getElementById('status').textContent = 'Ejecutando ' + action + '...';
      document.getElementById('output').textContent = 'Cargando...';
      try {
        const { data: { session } } = await client.auth.getSession();
        const r = await fetch(SUPABASE_URL + '/functions/v1/send-whatsapp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + session.access_token,
            'apikey': SUPABASE_KEY
          },
          body: JSON.stringify({ action: action })
        });
        const text = await r.text();
        let formatted;
        try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch { formatted = text; }
        document.getElementById('output').textContent = 'HTTP ' + r.status + '\n\n' + formatted;
        document.getElementById('status').textContent = action + ' completado. Status: ' + r.status;
      } catch (e) {
        document.getElementById('output').textContent = 'EXCEPTION: ' + e.message;
        document.getElementById('status').textContent = 'Error';
      }
    }
  </script>
</body>
</html>
