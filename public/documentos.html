<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mis Documentos | DIBA FBC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/ESCUDO.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: { dibaGold: '#ffcc00', dibaBlue: '#002a40', dibaDark: '#0a101b' }
                },
            },
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar-glow {
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }
    </style>
</head>

<body class="bg-dibaDark text-slate-200 min-h-screen">
    <div id="navbar-container"></div>

    <main class="max-w-4xl mx-auto px-4 py-12">
        <header class="mb-12 animate__animated animate__fadeInDown">
            <h1 class="text-4xl font-black text-white uppercase italic tracking-tighter">Gestión <span
                    class="text-dibaGold">Documental</span></h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] mt-2">Mantén tus registros
                actualizados para competir</p>
        </header>

        <!-- Resumen de Progreso -->
        <div class="glass rounded-[2.5rem] p-8 mb-10 animate__animated animate__fadeInUp">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-[10px] font-black uppercase text-slate-500 tracking-widest mb-1">Estado General</p>
                    <h2 id="progress-text" class="text-2xl font-black text-white italic uppercase">0% Completado</h2>
                </div>
                <div class="text-right">
                    <span id="pending-count"
                        class="text-[10px] font-black bg-dibaGold/10 text-dibaGold px-3 py-1 rounded-full uppercase tracking-widest border border-dibaGold/20">5
                        PENDIENTES</span>
                </div>
            </div>
            <div class="w-full h-4 bg-white/5 rounded-full overflow-hidden p-1 border border-white/5">
                <div id="progress-bar"
                    class="h-full bg-gradient-to-r from-dibaGold to-amber-500 rounded-full transition-all duration-1000 w-0 progress-bar-glow">
                </div>
            </div>
        </div>

        <!-- Lista de Documentos -->
        <div id="docs-list" class="grid gap-4 animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
            <!-- Carga inicial animada -->
            <div class="flex justify-center py-20"><i
                    class="fas fa-circle-notch animate-spin text-3xl text-dibaGold"></i></div>
        </div>

        <div class="mt-12 p-6 rounded-3xl bg-amber-500/5 border border-amber-500/10 text-center">
            <p class="text-[11px] text-slate-400 font-bold leading-relaxed">
                <i class="fas fa-info-circle text-dibaGold mr-2"></i>
                RECUERDA: Los documentos deben estar legibles en formato PDF o Imagen (JPG/PNG). <br>
                Cualquier cambio será revisado por el cuerpo técnico del club.
            </p>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/scripts/config.js"></script>
    <script type="module" src="/scripts/documentos.js"></script>
</body>

</html>
