<section
    class="py-20 bg-slate-950 border-y border-white/5 relative overflow-hidden">
    <!-- Luces de fondo sutiles -->
    <div
        class="absolute top-0 left-1/4 w-96 h-96 bg-amber-500/10 blur-[130px] rounded-full pointer-events-none">
    </div>
    <div
        class="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-600/10 blur-[130px] rounded-full pointer-events-none">
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

        <div class="text-center mb-12" data-aos="fade-up">
            <span class="text-xs font-black tracking-[0.3em] text-amber-400 uppercase">ORGULLO BARRANQUILLERO</span>
            <h2 class="text-3xl md:text-5xl font-black text-white uppercase italic tracking-tight font-display mt-2 mb-3">Nuestra <span
                    class="text-amber-500">Trayectoria</span>
            </h2>
            <div class="w-20 h-1 bg-gradient-to-r from-amber-500 to-amber-400 mx-auto rounded-full shadow-[0_0_12px_rgba(245,158,11,0.5)]"></div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">

            <!-- Stat 1: Años -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="0">
                <div
                    class="relative h-full bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-2xl group-hover:border-amber-500/40 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                        <i class="fas fa-calendar-alt text-2xl text-amber-400"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-white font-display tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-years" data-target="0">0</span>
                        <span class="text-amber-400 ml-1 text-3xl font-black">+</span>
                    </div>
                    <p class="text-white text-xs md:text-sm font-black uppercase tracking-[0.15em] mb-1 font-display">Años de Historia
                    </p>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Desde 2012</p>
                </div>
            </div>

            <!-- Stat 2: Trofeos -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="100">
                <div
                    class="relative h-full bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-2xl group-hover:border-amber-500/40 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_15px_rgba(245,158,11,0.2)]">
                        <i class="fas fa-trophy text-2xl text-amber-400"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-white font-display tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-trophies" data-target="0">0</span>
                    </div>
                    <p class="text-white text-xs md:text-sm font-black uppercase tracking-[0.15em] mb-1 font-display">Trofeos Ganados
                    </p>
                    <div
                        class="flex items-center justify-center gap-2 text-[10px] text-slate-400 uppercase font-bold">
                        <span title="Campeones" class="text-amber-400"><i class="fas fa-medal mr-0.5"></i> 13</span>
                        <span title="Subcampeones" class="text-slate-300"><i class="fas fa-medal mr-0.5"></i> 2</span>
                        <span title="Tercer Puesto" class="text-amber-600"><i class="fas fa-medal mr-0.5"></i> 3</span>
                    </div>
                </div>
            </div>

            <!-- Stat 3: Jugadores -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="200">
                <div
                    class="relative h-full bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-2xl group-hover:border-amber-500/40 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-2xl bg-sky-500/15 border border-sky-500/30 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_15px_rgba(56,189,248,0.2)]">
                        <i class="fas fa-users text-2xl text-sky-400"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-white font-display tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-players" data-target="0">0</span>
                        <span class="text-amber-400 ml-1 text-3xl font-black">+</span>
                    </div>
                    <p class="text-white text-xs md:text-sm font-black uppercase tracking-[0.15em] mb-1 font-display">Jugadores Activos</p>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">En Formación</p>
                </div>
            </div>

            <!-- Stat 4: Compromiso -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="300">
                <div
                    class="relative h-full bg-slate-900/60 backdrop-blur-xl border border-white/10 shadow-2xl group-hover:border-amber-500/40 rounded-3xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-2xl bg-rose-500/15 border border-rose-500/30 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_15px_rgba(244,63,94,0.2)]">
                        <i class="fas fa-heart text-2xl text-rose-400"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-white font-display tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-commitment" data-target="100">0</span>
                        <span class="text-rose-400 ml-1 text-3xl font-black">%</span>
                    </div>
                    <p class="text-white text-xs md:text-sm font-black uppercase tracking-[0.15em] mb-1 font-display">Compromiso Total</p>
                    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Pasión y Lealtad</p>
                </div>
            </div>

        </div>
    </div>
</section>
