<section
    class="py-20 bg-slate-50 border-y border-slate-200 relative overflow-hidden">
    <!-- Luces de fondo sutiles -->
    <div
        class="absolute top-0 left-1/4 w-96 h-96 bg-amber-500/5 blur-[120px] rounded-full pointer-events-none">
    </div>
    <div
        class="absolute bottom-0 right-1/4 w-96 h-96 bg-blue-600/5 blur-[120px] rounded-full pointer-events-none">
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

        <div class="text-center mb-12" data-aos="fade-up">
            <h2 class="text-3xl md:text-4xl font-black text-slate-900 uppercase tracking-wider mb-2">Nuestra <span
                    class="text-amber-500">Trayectoria</span>
            </h2>
            <div class="w-24 h-1 bg-amber-500 mx-auto rounded-full mb-4 shadow-sm"></div>
            <p class="text-slate-500 text-sm font-bold uppercase tracking-widest">El orgullo de Barranquilla</p>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">

            <!-- Stat 1 -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="0">
                <div
                    class="relative h-full bg-white border border-slate-200 shadow-md group-hover:shadow-xl group-hover:border-amber-500/50 rounded-2xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-full bg-amber-50 flex items-center justify-center mb-4 border border-amber-200 group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-calendar-alt text-2xl text-amber-500"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-years" data-target="0">0</span>
                        <span class="text-amber-500 ml-1 text-3xl">+</span>
                    </div>
                    <p class="text-slate-900 text-xs md:text-sm font-bold uppercase tracking-[0.15em] mb-1">Años de Historia
                    </p>
                    <p class="text-[10px] text-slate-500 uppercase font-semibold">Desde 2012</p>
                </div>
            </div>

            <!-- Stat 2 -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="100">
                <div
                    class="relative h-full bg-white border border-slate-200 shadow-md group-hover:shadow-xl group-hover:border-blue-500/50 rounded-2xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center mb-4 border border-blue-200 group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-trophy text-2xl text-blue-600"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-trophies" data-target="0">0</span>
                    </div>
                    <p class="text-slate-900 text-xs md:text-sm font-bold uppercase tracking-[0.15em] mb-1">Trofeos Ganados
                    </p>
                    <div
                        class="flex items-center justify-center gap-2 text-[10px] text-slate-500 uppercase font-semibold">
                        <span title="Campeones"><i class="fas fa-medal text-amber-500"></i> 13</span>
                        <span title="Subcampeones"><i class="fas fa-medal text-slate-400"></i> 2</span>
                        <span title="Tercer Puesto"><i class="fas fa-medal text-amber-700"></i> 3</span>
                    </div>
                </div>
            </div>

            <!-- Stat 3 -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="200">
                <div
                    class="relative h-full bg-white border border-slate-200 shadow-md group-hover:shadow-xl group-hover:border-amber-500/50 rounded-2xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-full bg-amber-50 flex items-center justify-center mb-4 border border-amber-200 group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-users text-2xl text-amber-500"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-players" data-target="0">0</span>
                        <span class="text-amber-500 ml-1 text-3xl">+</span>
                    </div>
                    <p class="text-slate-900 text-xs md:text-sm font-bold uppercase tracking-[0.15em] mb-1">Jugadores
                        Activos</p>
                    <p class="text-[10px] text-slate-500 uppercase font-semibold">En Formación</p>
                </div>
            </div>

            <!-- Stat 4 -->
            <div class="relative group" data-aos="fade-up" data-aos-delay="300">
                <div
                    class="relative h-full bg-white border border-slate-200 shadow-md group-hover:shadow-xl group-hover:border-blue-500/50 rounded-2xl p-6 md:p-8 flex flex-col items-center justify-center text-center transition-all duration-500 hover:-translate-y-2">
                    <div
                        class="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center mb-4 border border-blue-200 group-hover:scale-110 transition-transform duration-500">
                        <i class="fas fa-heart text-2xl text-blue-600"></i>
                    </div>
                    <div
                        class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter mb-1 flex items-center justify-center">
                        <span class="stats-number" id="stats-commitment" data-target="100">0</span>
                        <span class="text-blue-600 ml-1 text-3xl">%</span>
                    </div>
                    <p class="text-slate-900 text-xs md:text-sm font-bold uppercase tracking-[0.15em] mb-1">Compromiso Total</p>
                </div>

            </div>
        </div>
    </div>
</section>
