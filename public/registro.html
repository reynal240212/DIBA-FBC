<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - DIBA FBC</title>
  <link rel="shortcut icon" href="images/ESCUDO.ico" type="image/x-icon" />
  <!-- ... otros meta tags -->
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:image" content="https://diba-fbc.vercel.app/images/ESCUDO.webp" />
  <!-- URL absoluta a una imagen representativa -->
  <meta property="og:url" content="https://diba-fbc.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="REGISTRO" />
  <meta name="twitter:description" content="" />
  <meta name="twitter:image" content="https://diba-fbc.vercel.app/images/ESCUDO.webp" /> <!-- URL absoluta -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #020617;
      color: #ffffff;
    }

    header {
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo img {
      width: 50px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      text-decoration: none;
      color: #ffffff;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #ffd700;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-section {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
    }

    .login-section h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffd700;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .login-section form div {
      margin-bottom: 15px;
    }

    .login-section label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #cbd5e1;
    }

    .login-section input {
      width: 100%;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #ffffff;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .login-section input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
    }

    .login-section button {
      width: 100%;
      padding: 10px;
      background-color: #ffd700;
      color: #020617;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      transition: background-color 0.3s, transform 0.2s;
    }

    .login-section button:hover {
      background-color: #fbbf24;
      transform: translateY(-1px);
    }

    footer {
      background-color: rgba(15, 23, 42, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>

  <script src="scripts/config.js"></script>
  <script type="module" src="/scripts/registro.js"></script>
</head>

<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="images/ESCUDO.ico" alt="Logo DIBA FBC" loading="lazy" />
    </div>
    <nav>
      <ul>
        <li><a href="login.html">Login</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <!-- Registro -->
  <main>
    <section class="login-section">
      <h2>Registro</h2>
      <form id="registroForm">
        <div>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required />
        </div>
        <div>
          <label for="apellido">Apellido:</label>
          <input type="text" id="apellido" name="apellido" required />
        </div>
        <div>
          <label for="celular">Teléfono Celular:</label>
          <input type="tel" id="celular" name="celular" placeholder="+57..." required />
        </div>
        <div>
          <label for="correo">Correo:</label>
          <input type="email" id="correo" name="correo" required />
        </div>
        <div>
          <label for="clave">Contraseña:</label>
          <input type="password" id="clave" name="clave" required />
        </div>
        <button type="submit">Registrarse</button>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 DIBA FBC. Todos los derechos reservados.</p>
  </footer>
</body>

</html>
