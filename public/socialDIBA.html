<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diba FBC - Tu Equipo de Fútbol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1A5276 0%, #2E86C1 100%);
            /* Tonos de azul para un equipo de fútbol */
        }

        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen bg-gray-50">
    <!-- Navigation -->
    <!-- Navbar NUEVO añadido -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/ESCUDO.webp" alt="Logo DIBA FBC" height="50" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">INICIO</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">CLUB</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="Historia.html">Historia</a></li>
                            <li><a class="dropdown-item" href="escudo.html">Escudo</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="vision_mision.html">VISION Y MISION</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">PARTIDOS</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="ficha.html">Plantilla</a></li>
                            <li><a class="dropdown-item" href="partidos.html">Partidos / Entrenamiento</a></li>
                        </ul>
                    </li>
                    <li class="nav-item gold-link">
                        <a class="nav-link" href="contacto.html">CONTACTO</a>
                    </li>
                    <li class="nav-item gold-link">
                        <a class="nav-link" href="ayuda.html">AYUDA</a>
                    </li>
                </ul>
            </div>
            <div class="search-icon">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="pt-16 min-h-screen">
        <!-- Auth Section -->
        <section id="auth-section" class="min-h-screen flex items-center justify-center gradient-bg">
            <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md mx-4 fade-in">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">Bienvenido a Diba FBC</h2>

                <div id="login-form">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                            Email
                        </label>
                        <input
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            id="email" type="email" placeholder="tu@email.com">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                            Contraseña
                        </label>
                        <input
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            id="password" type="password" placeholder="••••••••">
                    </div>
                    <button onclick="login()"
                        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                        Iniciar Sesión
                    </button>
                    <p class="text-center text-sm text-gray-600 mt-4">
                        ¿No tienes cuenta?
                        <a href="#" onclick="showRegister()" class="text-blue-600 hover:underline">Regístrate aquí</a>
                    </p>
                </div>

                <div id="register-form" class="hidden">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="register-name">
                            Nombre Completo
                        </label>
                        <input
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            id="register-name" type="text" placeholder="Tu nombre">
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="register-email">
                            Email
                        </label>
                        <input
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            id="register-email" type="email" placeholder="tu@email.com">
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="register-password">
                            Contraseña
                        </label>
                        <input
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            id="register-password" type="password" placeholder="••••••••">
                    </div>
                    <button id="register" onclick="register()"
                        class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                        Crear Cuenta
                    </button>
                    <p class="text-center text-sm text-gray-600 mt-4">
                        ¿Ya tienes cuenta?
                        <a href="" onclick="showLogin()" class="text-blue-600 hover:underline">Inicia sesión aquí</a>
                    </p>
                </div>
            </div>
        </section>
        <script src="scripts/config.js"></script>
        <script src="/scripts/socialDIBA.js"></script>
</body>

</html>
