services:
  - type: web
    name: openwa-diba
    runtime: docker
    rootDir: openwa
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 2785
      - key: NODE_ENV
        value: production
      - key: ENGINE_TYPE
        value: baileys
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: DATABASE_TYPE
        value: sqlite
      - key: SESSION_DATA_PATH
        value: /app/data/sessions
      - key: BAILEYS_AUTH_DIR
        value: /app/data/baileys
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /app/data/storage
      - key: REDIS_ENABLED
        value: "false"
      - key: QUEUE_ENABLED
        value: "false"
      - key: CACHE_ENABLED
        value: "false"
      - key: SEARCH_ENABLED
        value: "false"
      - key: MCP_ENABLED
        value: "false"
      - key: AUTO_START_SESSIONS
        value: "true"
      - key: API_MASTER_KEY
        value: "diba-fbc-2026"
      - key: CORS_ORIGINS
        value: "https://diba-fbc.vercel.app,http://localhost:3000,http://localhost:5173"
    disk:
      name: openwa-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
